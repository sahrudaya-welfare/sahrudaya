<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | SAHRUDAYA</title>
  <link rel="icon" type="image/jpeg" href="/SWAN_LOGO.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #244b3c;
      --deep: #17392e;
      --leaf: #2b5d49;
      --cream: #e69e18;
      --gold: #c38f45;
      --panel: #ffffff;
      --line: #e8ddcf;
      --muted: #66756d;
      --soft-shadow: 0 18px 40px rgba(71, 58, 36, 0.12);
      --focus-ring: 0 0 0 3px rgba(43, 93, 73, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background-color: #fbfcf7;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(189, 214, 169, 0.28) 0, transparent 24%),
        radial-gradient(circle at 90% 12%, rgba(246, 236, 215, 0.65) 0, transparent 26%),
        linear-gradient(180deg, #fffcf6 0%, #fbfcf7 50%, #f5f8f4 100%);
      color: var(--deep);
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      line-height: 1.6;
    }
    .back-button {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 50;
      background: #ffffff;
      color: var(--deep);
      border: 1px solid var(--line);
      box-shadow: 0 6px 16px rgba(71, 58, 36, 0.08);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .back-button:hover {
      background: #fdf8ee;
      transform: translateY(-1px);
    }
    .card {
      width: min(100%, 450px);
      padding: 2.5rem 2.25rem;
      background: #ffffffeb;
      border: 1px solid rgba(36, 75, 60, 0.12);
      border-radius: 18px;
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(14px);
    }
    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-emblem {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--gold);
      padding: 3px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 14px rgba(71, 58, 36, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-emblem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.25rem;
      color: var(--ink);
      font-weight: 700;
      line-height: 1.1;
    }
    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    label {
      display: grid;
      gap: 6px;
      margin-top: 1.1rem;
      color: var(--deep);
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd6d0;
      border-radius: 6px;
      background: #ffffff;
      color: var(--deep);
      font: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--leaf);
      box-shadow: var(--focus-ring);
    }
    button[type="submit"] {
      width: 100%;
      margin-top: 1.5rem;
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: var(--deep);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--soft-shadow);
      transition: all 0.25s ease;
    }
    button[type="submit"]:hover {
      background: var(--leaf);
      transform: translateY(-1px);
    }
    .status {
      min-height: 1.35rem;
      margin: 1rem 0 0;
      color: #a32f2f;
      font-size: 13.5px;
      text-align: center;
    }
    .status.error {
      color: #a32f2f;
    }
    .status.success {
      color: var(--leaf);
      font-weight: 600;
    }
    .links {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(36, 75, 60, 0.08);
      font-size: 13px;
    }
    .links a {
      color: var(--leaf);
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <a href="/member-login.html" class="back-button">&larr; Back to Login</a>

  <main class="card">
    <div class="card-header">
      <div class="brand-emblem">
        <img src="/SWAN_LOGO.jpg" alt="SAHRUDAYA emblem" />
      </div>
      <h1>Choose New Password</h1>
      <p class="intro">Set a new, secure password for your SAHRUDAYA member account.</p>
    </div>

    <form id="reset-password-form">
      <label>
        <span>New Password (min. 6 characters)</span>
        <input type="password" name="password" minlength="6" placeholder="••••••••" required />
      </label>
      <label>
        <span>Confirm New Password</span>
        <input type="password" name="confirmPassword" minlength="6" placeholder="••••••••" required />
      </label>
      <button type="submit">Update Password</button>
      <p id="status" class="status" role="alert"></p>
    </form>

    <div class="links">
      <a href="/member-login.html">&larr; Back to sign in</a>
      <a href="/member-register.html">Create an account</a>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('reset-password-form');
    const status = document.getElementById('status');
    const submitButton = form.querySelector('button[type="submit"]');

    if (!token) {
      status.textContent = 'This password reset link is missing a valid token.';
      status.classList.add('error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!token) return;

      const formData = new FormData(form);
      const password = String(formData.get('password') || '').trim();
      const confirmPassword = String(formData.get('confirmPassword') || '').trim();

      status.textContent = '';
      status.classList.remove('success', 'error');

      if (!password || password.length < 6) {
        status.textContent = 'Password must be at least 6 characters long.';
        status.classList.add('error');
        return;
      }

      if (password !== confirmPassword) {
        status.textContent = 'Passwords do not match.';
        status.classList.add('error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating password...';

      try {
        const response = await fetch('/api/members/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to reset password');
        status.textContent = result.message || 'Password reset successfully. Redirecting...';
        status.classList.add('success');
        form.reset();

        setTimeout(() => {
          window.location.href = '/member-login.html';
        }, 1200);
      } catch (error) {
        status.textContent = error.message;
        status.classList.add('error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
