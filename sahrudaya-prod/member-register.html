<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Registration | SAHRUDAYA</title>
  <link rel="icon" type="image/jpeg" href="/SWAN_LOGO.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #244b3c;
      --deep: #17392e;
      --leaf: #2b5d49;
      --cream: #e69e18;
      --gold: #c38f45;
      --panel: #ffffff;
      --line: #e8ddcf;
      --muted: #66756d;
      --soft-shadow: 0 18px 40px rgba(71, 58, 36, 0.12);
      --focus-ring: 0 0 0 3px rgba(43, 93, 73, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2.5rem 1rem;
      background-color: #fbfcf7;
      background-image: 
        radial-gradient(circle at 8% 18%, rgba(189, 214, 169, 0.28) 0, transparent 24%),
        radial-gradient(circle at 92% 14%, rgba(246, 236, 215, 0.65) 0, transparent 26%),
        linear-gradient(180deg, #fffcf6 0%, #fbfcf7 50%, #f5f8f4 100%);
      color: var(--deep);
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      line-height: 1.6;
    }
    .back-button {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 50;
      background: #ffffff;
      color: var(--deep);
      border: 1px solid var(--line);
      box-shadow: 0 6px 16px rgba(71, 58, 36, 0.08);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .back-button:hover {
      background: #fdf8ee;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(71, 58, 36, 0.14);
    }
    .form-card {
      width: min(100%, 560px);
      padding: 2.5rem 2.25rem;
      background: #ffffffeb;
      border: 1px solid rgba(36, 75, 60, 0.12);
      border-radius: 18px;
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(14px);
    }
    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-emblem {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--gold);
      padding: 3px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 14px rgba(71, 58, 36, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-emblem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.25rem;
      color: var(--ink);
      font-weight: 700;
      line-height: 1.1;
    }
    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.25rem;
    }
    .form-full {
      grid-column: 1 / -1;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--deep);
      font-size: 13px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd6d0;
      border-radius: 6px;
      background: #ffffff;
      color: var(--deep);
      font: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--leaf);
      box-shadow: var(--focus-ring);
    }
    button[type="submit"] {
      width: 100%;
      margin-top: 1.25rem;
      padding: 13px 20px;
      border: 0;
      border-radius: 6px;
      background: var(--deep);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--soft-shadow);
      transition: all 0.25s ease;
    }
    button[type="submit"]:hover {
      background: var(--leaf);
      transform: translateY(-1px);
    }
    .status {
      min-height: 1.35rem;
      margin: 1rem 0 0;
      color: #a32f2f;
      font-size: 13.5px;
      text-align: center;
    }
    .status.success {
      color: var(--leaf);
      font-weight: 600;
    }
    .links {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(36, 75, 60, 0.08);
      font-size: 13px;
    }
    .links a {
      color: var(--leaf);
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
      color: var(--ink);
    }
    @media (max-width: 580px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <a href="/" class="back-button">&larr; Back to SAHRUDAYA</a>

  <main class="form-card">
    <div class="card-header">
      <div class="brand-emblem">
        <img src="/SWAN_LOGO.jpg" alt="SAHRUDAYA emblem" />
      </div>
      <h1>Create Member Account</h1>
      <p class="intro">Join SAHRUDAYA community to collaborate and participate in leadership initiatives.</p>
    </div>

    <form id="member-register-form">
      <div class="form-grid">
        <div>
          <label>
            <span>Full Name</span>
            <input type="text" name="name" placeholder="John Doe" required />
          </label>
        </div>
        <div>
          <label>
            <span>Email Address</span>
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
        </div>
        <div>
          <label>
            <span>Phone Number</span>
            <input type="tel" name="phone" placeholder="+91 9876543210" required />
          </label>
        </div>
        <div>
          <label>
            <span>City</span>
            <input type="text" name="city" placeholder="Hyderabad" required />
          </label>
        </div>
        <div class="form-full">
          <label>
            <span>Primary Area of Interest</span>
            <select name="interest" required>
              <option value="">Select an interest</option>
              <option value="Education">Education &amp; Student Mentorship</option>
              <option value="Community Service">Community Service &amp; Welfare</option>
              <option value="Leadership">Organizational Leadership &amp; Governance</option>
              <option value="Health and Wellness">Health, Nutrition &amp; Wellness</option>
              <option value="Volunteer Programs">Volunteer Drives &amp; Outreach</option>
            </select>
          </label>
        </div>
        <div class="form-full">
          <label>
            <span>Create Password (min. 6 characters)</span>
            <input type="password" name="password" minlength="6" placeholder="••••••••" required />
          </label>
        </div>
      </div>

      <button type="submit">Complete Registration</button>
      <p id="status" class="status" role="alert"></p>
    </form>

    <div class="links">
      <a href="/">&larr; Return to website</a>
      <a href="/member-login.html">Already have an account? Sign in</a>
    </div>
  </main>

  <script>
    const registerForm = document.getElementById('member-register-form');
    const status = document.getElementById('status');

    if (registerForm && status) {
      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        status.textContent = '';
        status.classList.remove('success');
        try {
          const response = await fetch('/api/members/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: form.get('name'),
              email: form.get('email'),
              phone: form.get('phone'),
              city: form.get('city'),
              interest: form.get('interest'),
              password: form.get('password')
            })
          });
          const result = await response.json();
          if (!response.ok) {
            if (response.status === 409) {
              status.innerHTML = `${result.message} <a href="/member-login.html" style="color:var(--deep); font-weight:700; text-decoration:underline; margin-left:6px;">Sign in here</a>`;
              return;
            }
            throw new Error(result.message || 'Registration failed');
          }
          status.classList.add('success');
          if (result.verificationUrl) {
            status.innerHTML = `${result.message}<br><br><a href="${result.verificationUrl}" style="display:inline-block; padding:10px 18px; background:var(--deep); color:#ffffff; font-weight:600; text-decoration:none; border-radius:6px; margin-top:4px;">Click here to verify email now</a>`;
          } else {
            status.textContent = result.message || 'Registration successful. Verify your email.';
          }
          registerForm.reset();
        } catch (error) {
          status.textContent = error.message;
        }
      });
    }
  </script>
</body>
</html>
